<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Agent Manager</h1>
    <div id="sup-pill" class="pill idle"><span class="dot"></span><span id="sup-text">supervisors idle</span></div>
    <div class="spacer"></div>
    <div id="stats" class="muted"></div>
    <button id="new-task" class="primary">+ New task</button>
  </header>

  <main>
    <section class="panel" id="tasks-panel">
      <h2>Tasks <span class="count" id="tasks-count"></span></h2>
      <div id="tasks" class="scroll"></div>
    </section>

    <section class="panel" id="agents-panel">
      <h2>Agents <span class="count" id="agents-count"></span><span class="hint">read-only · talk to the supervisor</span></h2>
      <div id="agents" class="scroll"></div>
    </section>

    <section class="panel" id="chat-panel">
      <h2>Chat <select id="scope" title="Each task has its own supervisor"></select><span id="scope-state" class="muted"></span><button id="sup-stop" class="ghost small hidden">Stop turn</button></h2>
      <div id="chat" class="scroll"></div>
      <form id="composer">
        <textarea id="msg" rows="2" placeholder="Message the supervisor…  (@a1 or @name to point at an agent · Enter to send, Shift+Enter for newline)"></textarea>
        <button class="primary" type="submit">Send</button>
      </form>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
