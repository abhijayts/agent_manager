<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>

  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="#0b0f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="3.2" r="1.6"/><circle cx="3" cy="12.4" r="1.6"/><circle cx="13" cy="12.4" r="1.6"/><path d="M7.2 4.7L3.8 10.9M8.8 4.7l3.4 6.2"/></svg></div>
      <h1>Agent Manager</h1>
    </div>
    <div id="sup-pill" class="pill idle"><span class="dot"></span><span id="sup-text">supervisors idle</span></div>
    <div class="spacer"></div>
    <div id="stats" class="muted"></div>
    <button id="usage-btn" class="usage-btn" title="Claude Code plan usage"><span class="gauge" id="usage-gauge"></span><span id="usage-mini">Usage</span></button>
    <button id="new-task" class="primary">+ New task</button>
  </header>

  <main>
    <aside class="panel" id="explorer">
      <h2>Explorer <span class="count" id="tasks-count"></span><button id="collapse-all" class="ghost small" title="Collapse all tasks">Collapse all</button></h2>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="panel" id="main">
      <div id="pane-head"></div>
      <div id="pane-tabs"></div>
      <div id="pane-body" class="pane-body"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
