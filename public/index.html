<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>

  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="#0b0f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="3.2" r="1.6"/><circle cx="3" cy="12.4" r="1.6"/><circle cx="13" cy="12.4" r="1.6"/><path d="M7.2 4.7L3.8 10.9M8.8 4.7l3.4 6.2"/></svg></div>
      <h1>Agent Manager</h1>
    </div>
    <div id="sup-pill" class="pill idle"><span class="dot"></span><span id="sup-text">supervisors idle</span></div>
    <div class="spacer"></div>
    <div id="stats" class="muted"></div>
    <button id="new-task" class="primary">+ New task</button>
  </header>

  <main>
    <section class="panel" id="tasks-panel">
      <h2>Tasks <span class="count" id="tasks-count"></span></h2>
      <div id="tasks" class="scroll"></div>
    </section>

    <section class="panel" id="agents-panel">
      <h2>Agents <span class="count" id="agents-count"></span><span class="hint">read-only · talk to a supervisor</span></h2>
      <div id="agents" class="scroll"></div>
    </section>

    <section class="panel" id="chat-panel">
      <h2>Chat <select id="scope" title="Each task has its own supervisor"></select><span id="scope-state" class="muted"></span><button id="sup-stop" class="ghost small hidden">Stop turn</button></h2>
      <div id="chat" class="scroll"></div>
      <form id="composer">
        <textarea id="msg" rows="1" placeholder="Message the supervisor…"></textarea>
        <button class="primary" type="submit" title="Send"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l14-7-5 14-2.5-5.5z"/></svg></button>
      </form>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
